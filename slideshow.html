<!doctype html>

      <div class="slide-stage" id="slide-stage" aria-busy="true">

            <label class="sr-only" for="page-number">이동할 슬라이드 번호</label>
            <input id="page-number" type="number" inputmode="numeric" min="1" max="34" value="1" aria-label="이동할 슬라이드 번호" disabled>
            <span aria-hidden="true">/</span><span id="page-total">34</span>

        <div class="view-actions">

        </div>

      <p class="keyboard-help" id="keyboard-help"><span class="desktop-help">← → / Space 이동 · F 전체화면 · G 전체 슬라이드</span><span class="touch-help">좌우로 밀어 이동 · 번호를 입력해 바로 이동</span></p>

      <p class="toast" id="toast" role="status" hidden></p>
      <noscript><p class="noscript-notice">슬라이드 쇼를 보려면 JavaScript를 켜 주세요. <a href="/assets/bigkachu-kim-taehyun/bigkachu-kim-taehyun.pdf">원본 PDF 열기</a></p></noscript>

    <dialog id="overview" aria-labelledby="overview-title">
      <div class="overview-header"><div><p>SLIDE OVERVIEW</p><h2 id="overview-title">전체 슬라이드 <span>34</span></h2></div><button id="close-overview" aria-label="전체 슬라이드 목록 닫기">닫기 <span aria-hidden="true">×</span></button></div>
