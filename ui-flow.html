<!doctype html>
<html lang="ko" class="presentation">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>UI Flow | GoldenTime Router</title>
    <meta name="description" content="GoldenTime Router의 메인 화면, 환자 정보, 병원 연락과 상세 정보까지 8개의 UI 화면을 순서대로 볼 수 있습니다.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/slideshow.css">
    <script src="/slideshow.js" defer></script>
  </head>
  <body>
    <a class="viewer-back" href="/" aria-label="자료 목록으로 돌아가기" title="자료 목록으로 돌아가기">⬅️</a>
    <main class="viewer flow-viewer" data-manifest="/assets/ui-flow/slides.json" data-hash-prefix="step" aria-label="GoldenTime Router UI Flow" aria-describedby="keyboard-help">
      <h1 class="sr-only">GoldenTime Router UI Flow</h1>
      <p class="sr-only" id="keyboard-help">방향키와 Space로 이동, Home과 End로 첫 화면과 마지막 화면, 숫자를 입력하고 Enter로 해당 화면 이동, F로 전체화면.</p>
      <div class="slide-stage" id="slide-stage" aria-busy="true">
        <div class="flow-crop">
          <img id="slide-image" src="/assets/ui-flow/step-01.webp?v=c525101b7b04" width="2732" height="2048" alt="GoldenTime Router UI Flow · 메인 화면, 1 / 8" fetchpriority="high" draggable="false">
          <svg id="slide-links" class="slide-links" viewBox="0 0 2732 2048" preserveAspectRatio="xMidYMid meet" role="group" aria-label="화면 안의 링크"></svg>
        </div>
        <div class="stage-notice" id="stage-notice" role="status" hidden>
          <p id="stage-message"></p>
          <div id="recovery" hidden><button id="retry">다시 불러오기</button> <a href="/">자료 목록으로 돌아가기</a></div>
        </div>
      </div>
      <p class="sr-only" id="slide-announcement" aria-live="polite" aria-atomic="true"></p>
      <p class="toast" id="toast" role="status" hidden></p>
      <noscript><p class="noscript-notice">UI Flow를 넘겨 보려면 JavaScript를 켜 주세요. <a href="/">자료 목록으로 돌아가기</a></p></noscript>
    </main>
  </body>
</html>
